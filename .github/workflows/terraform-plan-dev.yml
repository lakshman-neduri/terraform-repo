name: Terraform Plan Dev
permissions:
  contents: read
  id-token: write
  pull-requests: write

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
jobs:
    terraform-plan:
        name: Terraform Plan Dev
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: 1.15.1

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Terraform Init
              run: terraform init

            - name: Select Dev workspace
              run: terraform workspace select dev || terraform workspace new dev

            - name: Verify workspace
              run: terraform workspace show

            - name: Terraform Plan
              run: terraform plan -out=tfplan.binary
            
            - name: Convert Terraform Plan to JSON
              run: terraform show -json tfplan.binary > tfplan.json


            - name: Generate Terraform Summary
              run: |
                echo "## Terraform Plan - DEV" > terraform-summary.md
                echo "" >> terraform-summary.md

                echo "### Summary" >> terraform-summary.md
                echo "" >> terraform-summary.md

                ADDED=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' tfplan.json)
                CHANGED=$(jq '[.resource_changes[]? | select(.change.actions | index("update"))] | length' tfplan.json)
                DESTROYED=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' tfplan.json)

                echo "| Action | Count |" >> terraform-summary.md
                echo "|--------|------:|" >> terraform-summary.md
                echo "| Create | $ADDED |" >> terraform-summary.md
                echo "| Change | $CHANGED |" >> terraform-summary.md
                echo "| Destroy | $DESTROYED |" >> terraform-summary.md
                echo "" >> terraform-summary.md

                echo "### Resources" >> terraform-summary.md
                echo "" >> terraform-summary.md

                echo "#### 🟢 Create" >> terraform-summary.md
                jq -r '
                  .resource_changes[]?
                  | select(.change.actions | index("create"))
                  | "- `" + .address + "`"
                ' tfplan.json >> terraform-summary.md

                echo "" >> terraform-summary.md
                echo "#### 🟡 Change" >> terraform-summary.md
                jq -r '
                  .resource_changes[]?
                  | select(.change.actions | index("update"))
                  | "- `" + .address + "`"
                ' tfplan.json >> terraform-summary.md

                echo "" >> terraform-summary.md
                echo "#### 🔴 Destroy" >> terraform-summary.md
                jq -r '
                  .resource_changes[]?
                  | select(.change.actions | index("delete"))
                  | "- `" + .address + "`"
                ' tfplan.json >> terraform-summary.md
            
            